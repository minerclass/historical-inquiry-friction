name: Deploy to GitHub Pages

# Replaces the legacy branch-based Pages build, which hung repeatedly on a
# sibling repository: the build job sat with updated_at never advancing past
# created_at, and only a cancel plus a manual
# `POST /repos/:owner/:repo/pages/builds` cleared it. This path publishes the
# site as an artifact instead, so a stuck run is visible and re-runnable from
# the Actions tab.

on:
  push:
    branches: [main]
  # Lets a stuck or superseded deploy be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Lets the wait step below read this run's artifact list.
  actions: read

# Never cancel a deploy that is already publishing. A cancelled deploy-pages run
# can leave the Pages environment mid-update, which is the failure mode this
# workflow exists to avoid.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Static files, no build step. This publishes the same tree the legacy
      # build served.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # deploy-pages looks the artifact up the moment the upload finishes. On
      # 2026-11-25 the artifact list lagged behind the upload by more than that,
      # and three deploys in a row failed with "No artifacts named github-pages
      # were found". Wait until the list shows it.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then
              echo "Artifact listed after $i checks"
              exit 0
            fi
            sleep 2
          done
          echo "The artifact was not listed after 60 seconds"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
