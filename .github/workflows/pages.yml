name: Deploy to GitHub Pages

# Replaces the legacy branch-based Pages build, which hung repeatedly on a
# sibling repository: the build job sat with updated_at never advancing past
# created_at, and only a cancel plus a manual
# `POST /repos/:owner/:repo/pages/builds` cleared it. This path publishes the
# site as an artifact instead, so a stuck run is visible and re-runnable from
# the Actions tab.

on:
  push:
    branches: [main]
  # Lets a stuck or superseded deploy be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Lets the wait step below read this run's artifact list.
  actions: read

# Never cancel a deploy that is already publishing. A cancelled deploy-pages run
# can leave the Pages environment mid-update, which is the failure mode this
# workflow exists to avoid.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Static files, no build step. This publishes the same tree the legacy
      # build served.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # deploy-pages looks the artifact up the moment the upload finishes, and the
      # artifact list is not consistent for a short while after an upload. On
      # 2026-11-25 several deploys failed with "No artifacts named github-pages
      # were found"; one of them failed after a single check had already seen
      # the artifact listed. So: wait until it is listed three times in a row,
      # let it settle, and retry the deploy once if it still fails.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seen=0
          for i in $(seq 1 40); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then seen=$((seen + 1)); else seen=0; fi
            if [ "$seen" -ge 3 ]; then
              echo "Artifact listed on three checks in a row (check $i); settling"
              sleep 15
              exit 0
            fi
            sleep 3
          done
          echo "The artifact was not listed reliably after two minutes"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
